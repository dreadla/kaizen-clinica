<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Curso</title>
</head>
<body>

<h1>Eliminar Curso</h1>

<p>
    ¿Seguro que deseas eliminar el curso
    <strong>{{ curso.nombre }}</strong>?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Sí, eliminar
    </button>

</form>

<p>
    <a href="/cursos/">Cancelar</a>
</p>

</body>
</html>
