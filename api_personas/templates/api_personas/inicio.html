<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Kaizen Clínica</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }


        header {
            background: #2563eb;
            color: white;
            padding: 30px;
            text-align: center;
        }


        header h1 {
            margin: 0;
            font-size: 38px;
        }


        .contenido {
            text-align: center;
            padding: 40px;
        }


        .tarjetas {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 30px;
        }


        .tarjeta {

            background: white;
            width: 280px;
            padding: 25px;
            border-radius: 15px;

            box-shadow: 0px 5px 15px #cccccc;

        }


        .tarjeta h2 {
            color: #2563eb;
        }


        .boton {

            display: inline-block;
            margin-top: 15px;

            background: #2563eb;
            color: white;

            padding: 12px 25px;

            border-radius: 8px;

            text-decoration: none;

        }


        footer {

            background: #111827;
            color:white;

            text-align:center;

            padding:20px;

            margin-top:40px;

        }


    </style>

</head>


<body>


<header>

<h1>Sistema Kaizen Clínica</h1>

<p>Gestión académica</p>

</header>



<div class="contenido">


<h1>Panel Principal</h1>

<p>Seleccione un módulo</p>



<div class="tarjetas">


<div class="tarjeta">

<h2>Alumnos</h2>

<p>Administración de alumnos registrados.</p>

<a class="boton" href="#">Ingresar</a>

</div>



<div class="tarjeta">

<h2>Cursos</h2>

<p>Gestión de cursos disponibles.</p>

<a class="boton" href="#">Ingresar</a>

</div>



<div class="tarjeta">

<h2>Certificados</h2>

<p>Control de certificados.</p>

<a class="boton" href="#">Ingresar</a>

</div>



</div>


</div>



<footer>

Sistema Kaizen Clínica

<br>

Desarrollado con Django

</footer>


</body>

</html>
