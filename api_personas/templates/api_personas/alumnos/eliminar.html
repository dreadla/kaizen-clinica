<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Alumno</title>
</head>
<body>

<h1>Eliminar Alumno</h1>

<p>
    ¿Seguro que deseas eliminar a
    <strong>{{ alumno.nombre }} {{ alumno.apellido }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
</form>

<p>
    <a href="/alumnos/">Cancelar</a>
</p>

</body>
</html>
