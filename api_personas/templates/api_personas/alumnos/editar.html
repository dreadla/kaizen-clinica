<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Alumno</title>
</head>
<body>

<h1>Editar Alumno</h1>

<form method="POST">
    {% csrf_token %}

    <p>
        Nombre:<br>
        <input type="text" name="nombre" value="{{ alumno.nombre }}" required>
    </p>

    <p>
        Apellido:<br>
        <input type="text" name="apellido" value="{{ alumno.apellido }}" required>
    </p>

    <p>
        Email:<br>
        <input type="email" name="email" value="{{ alumno.email }}" required>
    </p>

    <p>
        Teléfono:<br>
        <input type="text" name="telefono" value="{{ alumno.telefono }}">
    </p>

    <p>
        Fecha de nacimiento:<br>
        <input type="date"
               name="fecha_nacimiento"
               value="{{ alumno.fecha_nacimiento|date:'Y-m-d' }}"
               required>
    </p>

    <button type="submit">Guardar cambios</button>
</form>

<p>
    <a href="/alumnos/">Cancelar</a>
</p>

</body>
</html>
