<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Médicos - Kaizen Clínica</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Segoe UI',Arial,sans-serif;
background:#eef5ff;
}


header{

background:linear-gradient(135deg,#2563eb,#0f3d91);
color:white;
text-align:center;
padding:30px;

}


header h1{

margin:0;
font-size:35px;

}



.card{

background:white;

width:420px;

margin:50px auto;

padding:35px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

text-align:center;

}



h2{

color:#2563eb;

font-size:32px;

}


p{

color:#555;

}



label{

font-weight:bold;

display:block;

margin-top:15px;

}



input{

width:90%;

padding:12px;

border-radius:10px;

border:1px solid #ccc;

font-size:15px;

}



input:focus{

outline:none;

border-color:#2563eb;

}



button{

margin-top:25px;

background:#2563eb;

color:white;

border:none;

padding:12px 30px;

border-radius:25px;

font-size:16px;

cursor:pointer;

}



button:hover{

background:#0f3d91;

}



a{

display:inline-block;

margin-top:25px;

background:#111827;

color:white;

padding:12px 25px;

border-radius:25px;

text-decoration:none;

}



a:hover{

background:#374151;

}


</style>

</head>


<body>


<header>

<h1>🏥 Kaizen Clínica</h1>

<p>Gestión del personal médico</p>

</header>



<div class="card">


<h2>👨‍⚕️ Médicos</h2>


<p>
Registro y administración de médicos.
</p>


<form>


<label>Nombre</label>

<input type="text" placeholder="Ingrese nombre">


<label>Apellido</label>

<input type="text" placeholder="Ingrese apellido">


<label>Especialidad</label>

<input type="text" placeholder="Ingrese especialidad">


<button>
Guardar médico
</button>


</form>



<a href="/">
Volver al inicio
</a>


</div>


</body>

</html>
